<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }} | عالم الألعاب</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5ff;--surface:#fff;--ink:#0b1634;--muted:#4d5d88;--line:#d5def5;--cyan:#0b8fb8;--red:#d81b2a;--hero:#0b1634;--onhero:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0a1229;--surface:#111c40;--ink:#eef3ff;--muted:#a3b3de;--line:#243768;--cyan:#19d3ff;--red:#ff4a56}}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--hero)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-weight:600;line-height:1.9;font-size:18px}
a{color:var(--red)}
.top{background:var(--hero);color:var(--onhero);display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.top a{color:var(--onhero);text-decoration:none;font-weight:900}
main{max-width:720px;margin:0 auto;padding:26px 18px 10px}
h1{font-weight:900;font-size:clamp(28px,6vw,40px);line-height:1.35;margin:0 0 6px}
h2{font-weight:900;font-size:24px;margin:32px 0 6px}
.meta{color:var(--muted);font-size:14px;margin-bottom:18px}
img{max-width:100%;height:auto;border-radius:12px}
blockquote{margin:18px 0;padding:4px 16px;border-right:4px solid var(--cyan);color:var(--muted)}
ul,ol{padding-right:22px}
.video{position:relative;padding-top:56.25%;margin:20px 0;border-radius:12px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.alist{list-style:none;padding:0;border-top:1px solid var(--line)}
.alist li{border-bottom:1px solid var(--line);padding:12px 2px}
.alist a{text-decoration:none;font-weight:900;color:var(--ink)}
footer{margin-top:40px;background:var(--hero);color:#c9d6fb;text-align:center;padding:22px 18px;font-size:15px}
footer a{color:var(--onhero);margin:0 8px}
</style>
</head>
<body>
<header class="top"><a href="/">عالم الألعاب</a><a href="/articles.html">المقالات</a></header>
<main>
<article>
<h1>{{ page.title }}</h1>
{% if page.date %}<div class="meta">{{ page.date | date: "%Y-%m-%d" }}</div>{% endif %}
{{ content }}
</article>
</main>
<footer><a href="https://www.youtube.com/@Worldofgames-s4q">يوتيوب</a><a href="/">الرئيسية</a></footer>
</body>
</html>
